spring.application.name=estacionamiento-utp
server.port=8080
server.servlet.context-path=/

# ============ BASE DE DATOS ============
spring.datasource.url=jdbc:mysql://localhost:3306/estacionamiento_utp?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ JPA / HIBERNATE ============
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============ ACTUATOR - MONITOREO ============
management.endpoints.web.exposure.include=health,info,metrics,env,beans,prometheus,loggers
management.endpoints.web.exposure.exclude=shutdown
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.env.show-values=always
management.endpoint.loggers.enabled=true
management.info.env.enabled=true

# ============ PROMETHEUS ============
management.prometheus.metrics.export.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=production
management.metrics.web.server.request.autotime.enabled=true

# ============ INFORMACIÓN DE APLICACION ============
info.app.name=Sistema de Estacionamiento UTP
info.app.description=Plataforma profesional de gestión de estacionamiento con monitoreo en tiempo real, actuador, logback, Prometheus y Grafana.
info.app.version=1.0.0
info.app.author=Equipo de Desarrollo UTP
info.app.encoding=UTF-8
info.java.version=17
info.organization.name=Universidad Tecnológica del Perú
info.organization.website=https://www.utp.edu.pe

# ============ LOGGING - LOGBACK ============
logging.config=classpath:logback-spring.xml
logging.level.root=INFO
logging.level.pe.utp.estacionamiento=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.actuate=INFO
logging.level.org.hibernate=WARN
logging.level.com.mysql.cj.jdbc=WARN

# ============ ARCHIVO DE LOGS ============
app.monitoring.log-file=logs/estacionamiento.log
app.monitoring.error-log-file=logs/errores.log
app.monitoring.simulate-missing-data=true
app.monitoring.cache-interval-seconds=5

# ============ CONFIGURACION DE BASE DE DATOS (Legado) ============
db.url=jdbc:mysql://localhost:3306/estacionamiento_utp?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
db.user=root
db.password=

# ============ REPORTES Y ARCHIVOS ============
report.output-dir=reportes
report.file-name=reporte_estacionamiento.xlsx
report.auto-generate-on-startup=false

# ============ TARIFAS Y CONFIGURACION PARKING ============
parking.hourly-rate=3.00
parking.minimum-charge=1.00
parking.maximum-charge=50.00
parking.currency=PEN
parking.timezone=America/Lima

# ============ CONEXION POOL ============
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ============ THYMELEAF ============
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# ============ ENCODING ============
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ============ SERVIDOR ============
server.compression.enabled=true
server.compression.min-response-size=1024
